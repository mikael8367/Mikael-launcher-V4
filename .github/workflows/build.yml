name: Build Mikael APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: chmod +x gradlew || true
      - run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7 || true
          fi
      - run: ./gradlew :app:assembleDebug --stacktrace || gradle :app:assembleDebug --stacktrace
      - run: cp app/build/outputs/apk/debug/app-debug.apk Mikael-Launcher.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mikael-launcher-apk
          path: "**/app-debug.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v4-build-${{ github.run_number }}
          name: Mikael Launcher V4 - build ${{ github.run_number }}
          body: APK gerado automaticamente do commit ${{ github.sha }}
          files: Mikael-Launcher.apk
